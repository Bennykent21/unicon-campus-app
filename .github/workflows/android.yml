name: Android APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # Run by hand from the Actions tab. With a version (e.g. 1.0.0) it
  # publishes an official release tagged v<version> instead of a test build.
  workflow_dispatch:
    inputs:
      version:
        description: "Version for an official release, e.g. 1.0.0 (leave empty for a test build)"
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      # The app reads SUPABASE_URL / SUPABASE_ANON_KEY from .env at startup.
      # Set them as repository secrets to override. The fallback is this
      # project's public client (anon) key: it ships inside every APK anyway,
      # and row level security is what protects the data.
      - name: Write .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          url="${SUPABASE_URL:-https://jynwadokkmenigbbwhqr.supabase.co}"
          key="${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5bndhZG9ra21lbmlnYmJ3aHFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjcyNjcsImV4cCI6MjA4Njg0MzI2N30.wnRv6s13NcMt-rbIWaZyhyKtAmYxQKN_7EPjM6j9HUI}"
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$url" "$key" > .env

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Keep the same signing key between runs so a new APK installs over the
      # previous one instead of failing with "App not installed".
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: unicon-debug-keystore-v1

      # Optional: sign with your own release key (needed for the Play Store).
      # Add ANDROID_KEYSTORE_BASE64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as repository secrets.
      # Without them the APK is signed with the cached key above.
      - name: Use release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_RELEASE_KEY == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: |
          # Official releases show their version in Android's app info;
          # test builds keep the one in pubspec.yaml.
          name_flag=""
          if [ -n "$VERSION" ]; then name_flag="--build-name=$VERSION"; fi
          flutter build apk --release $name_flag --build-number=${{ github.run_number }}
          # A smaller APK for 64-bit phones (almost every phone from 2017 on).
          flutter build apk --release --split-per-abi --target-platform android-arm64 $name_flag --build-number=${{ github.run_number }}

      - name: Name the APK
        run: |
          if [ -n "$VERSION" ]; then
            label="v$VERSION"
          else
            label="${{ github.run_number }}-$(git rev-parse --short HEAD)"
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/unicon-${label}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/unicon-${label}-arm64.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: unicon-apk
          path: dist/*.apk
          retention-days: 30

      # A Release gives a direct download link that works from a phone
      # browser (artifacts download as a zip).
      - name: Publish test build
        if: github.event_name != 'pull_request' && env.VERSION == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: UNICON build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          files: dist/*.apk
          body: |
            Built from `${{ github.sha }}` on `${{ github.ref_name }}`.
            Download the `.apk` below on your Android phone and open it. You may need to allow installs from your browser.
            The `-arm64` file is smaller and works on almost every phone; if it won't install, use the other one.

      - name: Publish official release
        if: env.VERSION != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: UNICON v${{ env.VERSION }}
          prerelease: false
          make_latest: "true"
          files: dist/*.apk
          body: |
            UNICON, the campus community app for University of Benin students.
            Built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            Download `unicon-v${{ env.VERSION }}-arm64.apk` on your Android phone and open it (it fits almost every phone). If it won't install, use `unicon-v${{ env.VERSION }}.apk`. You may need to allow installs from your browser.
